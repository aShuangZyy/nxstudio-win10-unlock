name: p4

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell:
    name: powershell (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Both shells matter, and they disagree: `-Encoding UTF8` writes a BOM
        # on 5.1 but not on 7, and $PSScriptRoot is empty while a
        # [CmdletBinding()] param block is being bound on both.
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Scripts carry a UTF-8 BOM
        shell: ${{ matrix.shell }}
        run: |
          $bad = $false
          foreach ($f in (Get-ChildItem scripts, tools -Filter *.ps1 -File)) {
            $b = [System.IO.File]::ReadAllBytes($f.FullName)
            $hasBom = $b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF
            if (-not $hasBom) {
              Write-Host "::error file=$($f.Name)::$($f.Name) has no UTF-8 BOM; Windows PowerShell 5.1 decodes it as ANSI and Chinese comments break parsing"
              $bad = $true
            }
          }
          if ($bad) { exit 1 }
          Write-Host 'every .ps1 carries a UTF-8 BOM'
