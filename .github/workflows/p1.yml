name: p1

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell:
    name: powershell (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Both shells matter, and they disagree: `-Encoding UTF8` writes a BOM
        # on 5.1 but not on 7, and $PSScriptRoot is empty while a
        # [CmdletBinding()] param block is being bound on both.
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
